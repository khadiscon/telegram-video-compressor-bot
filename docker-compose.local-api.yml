# Kept for a split-container setup. The default Dockerfile already
# runs telegram-bot-api + the bot in one process tree (Railway / compose).
#
#   docker compose -f docker-compose.yml -f docker-compose.local-api.yml up -d --build

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  bot:
    environment:
      TELEGRAM_LOCAL_API: "true"
      TELEGRAM_API_URL: http://telegram-bot-api:8081
      TELEGRAM_FILE_URL: http://telegram-bot-api:8081
      DOWNLOAD_LIMIT_MB: "500"
      UPLOAD_LIMIT_MB: "500"
    depends_on:
      - telegram-bot-api

volumes:
  bot-api-data:
